<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Security: only this page's own inline script/styles may run, and the only
     network call allowed is the FormSubmit endpoint. The script hash must be
     recomputed whenever the inline script changes (see CLAUDE.md). -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-fmIGUF3PVLHz3MUPjS5X1cBb75oRhK2KUqb0qZynKnE='; style-src 'unsafe-inline'; connect-src https://formsubmit.co; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>UOB IT PMO — Kanban</title>
<style>
/* =========================================================
   1. Design tokens
   ========================================================= */
:root {
  /* Corporate blues */
  --navy-900: #0d2b5e;
  --navy-700: #1d4488;
  --navy-100: #e3eaf6;
  --navy-50:  #f3f6fb;

  /* Ink and surfaces */
  --ink:     #1a2436;
  --ink-2:   #475467;
  --ink-3:   #667085;
  --line:    #d5ddea;
  --surface: #ffffff;
  --page:    #eef2f8;

  /* Status colours (validated as a set: CVD-safe in stacking order
     Done | In Progress | Blocked | Backlog). Shared by the chart,
     legend and column headers. */
  --s-done:     #2d55b8;
  --s-progress: #3399e0;
  --s-blocked:  #c47600;
  --s-backlog:  #9aa8f0;

  /* Priority (cards only) */
  --p-critical: #b42318;
  --p-high:     #0d2b5e;
  --p-medium:   #667085;
  --p-low:      #a3adbd;

  --danger:     #b42318;
  --danger-bg:  #fdeceb;
  --success:    #1e7a46;
  --success-bg: #e7f6ee;
  --warning:    #8a5300;
  --warning-bg: #fff4e0;

  --sp-1: 4px;
  --sp-2: 8px;
  --sp-3: 12px;
  --sp-4: 16px;
  --sp-5: 24px;
  --sp-6: 32px;
  --sp-7: 48px;

  --radius: 10px;
  --radius-sm: 6px;
  --shadow-lg: 0 16px 48px rgba(13, 43, 94, .28);

  --font-display: "Avenir Next", Avenir, "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}

/* =========================================================
   2. Base
   ========================================================= */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.45;
  color: var(--ink);
  background: var(--page);
  font-variant-numeric: tabular-nums;
}
h1, h2, h3, p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #ffbf47; outline-offset: 2px; }

.visually-hidden {
  position: absolute;
  width: 1px; height: 1px;
  padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0);
  white-space: nowrap; border: 0;
}

.btn {
  display: inline-flex;
  align-items: center;
  gap: var(--sp-1);
  padding: 9px var(--sp-4);
  border-radius: var(--radius-sm);
  border: 1px solid transparent;
  font-weight: 600;
  line-height: 1.2;
}
.btn-primary { background: var(--navy-700); color: #fff; }
.btn-primary:hover { background: var(--navy-900); }
.btn-primary[disabled] { background: var(--ink-3); cursor: progress; }
.btn-light { background: #fff; color: var(--navy-900); }
.btn-light:hover { background: var(--navy-100); }
.btn-ghost { background: transparent; color: var(--navy-700); border-color: var(--line); }
.btn-ghost:hover { background: var(--navy-50); }

/* =========================================================
   3. Header
   ========================================================= */
.app-header {
  background: var(--navy-900);
  color: #fff;
  padding: var(--sp-4) var(--sp-5) calc(var(--sp-7) + var(--sp-4));
}
.header-inner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3) var(--sp-5);
  max-width: 1440px;
  margin: 0 auto;
}
.wordmark {
  font-family: var(--font-display);
  font-size: 22px;
  font-weight: 800;
  letter-spacing: -.01em;
  line-height: 1.1;
}
.wordmark-sub {
  display: block;
  margin-top: 2px;
  font-family: var(--font);
  font-size: 13px;
  font-weight: 400;
  letter-spacing: 0;
  color: #b9c9e6;
}
.header-side { display: flex; align-items: center; gap: var(--sp-4); flex-wrap: wrap; }
.demo-note { font-size: 12px; color: #b9c9e6; max-width: 34ch; }

/* =========================================================
   4. Progress panel (the stacked bar chart)
   ========================================================= */
main { max-width: 1440px; margin: 0 auto; padding: 0 var(--sp-5) var(--sp-6); }

.progress-panel {
  position: relative;
  margin-top: calc(-1 * var(--sp-7));
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: 0 1px 3px rgba(13, 43, 94, .12);
  padding: var(--sp-5) var(--sp-5) var(--sp-4);
}
.progress-headline {
  font-family: var(--font-display);
  font-size: clamp(22px, 2.6vw, 32px);
  font-weight: 700;
  line-height: 1.15;
  letter-spacing: -.015em;
  color: var(--navy-900);
  max-width: 40ch;
}
.legend {
  list-style: none;
  margin: var(--sp-4) 0 var(--sp-2);
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: var(--sp-2) var(--sp-5);
  font-size: 13px;
  color: var(--ink-2);
}
.legend li { display: inline-flex; align-items: center; gap: 6px; }
.legend strong { color: var(--ink); }
.swatch { width: 12px; height: 12px; border-radius: 3px; flex: none; background: var(--seg-color); }

/* A bar is a row of segments separated by 2px surface gaps. Segment
   widths come from flex-grow (the count), so they animate on change. */
.bar {
  display: flex;
  gap: 2px;
  height: 40px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--navy-50);
  transform-origin: left center;
  transition: transform .7s cubic-bezier(.2, .7, .2, 1);
}
.bar-sm { height: 14px; }
.seg {
  flex: 0 1 0;
  min-width: 0;
  display: flex;
  align-items: center;
  padding: 0 var(--sp-2);
  overflow: hidden;
  white-space: nowrap;
  background: var(--seg-color);
  color: var(--seg-ink);
  font-size: 13px;
  font-weight: 700;
  transition: flex-grow .35s ease;
}
.seg[hidden] { display: none; }
.bar-sm .seg { padding: 0; }
.is-intro .bar { transform: scaleX(0); }

.st-done     { --seg-color: var(--s-done);     --seg-ink: #fff; }
.st-progress { --seg-color: var(--s-progress); --seg-ink: #0d1f3f; }
.st-blocked  { --seg-color: var(--s-blocked);  --seg-ink: #1c1100; }
.st-backlog  { --seg-color: var(--s-backlog);  --seg-ink: #0d1f3f; }

.by-project { margin-top: var(--sp-5); }
.by-project-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--sp-1) var(--sp-4);
  margin-bottom: var(--sp-2);
}
.by-project-head h3 { font-family: var(--font-display); font-size: 15px; font-weight: 700; color: var(--navy-900); }
.by-project-head p { font-size: 12px; color: var(--ink-3); }
.project-rows { list-style: none; margin: 0; padding: 0; }
.project-row {
  display: grid;
  grid-template-columns: minmax(150px, 220px) 1fr 104px;
  align-items: center;
  gap: var(--sp-4);
  padding: 7px var(--sp-2);
  margin: 0 calc(-1 * var(--sp-2));
  width: calc(100% + 2 * var(--sp-2));
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  text-align: left;
}
.project-row:hover { background: var(--navy-50); }
.project-row[aria-pressed="true"] { background: var(--navy-100); box-shadow: inset 3px 0 0 var(--navy-700); }
.project-name { font-weight: 600; color: var(--ink); }
.project-count { font-size: 12px; color: var(--ink-2); text-align: right; }
.project-row[aria-pressed="true"] .project-count { color: var(--navy-900); font-weight: 600; }

.chart-table { margin-top: var(--sp-3); font-size: 13px; }
.chart-table summary { cursor: pointer; color: var(--navy-700); font-weight: 600; width: max-content; }
.chart-table table { border-collapse: collapse; margin-top: var(--sp-2); min-width: min(100%, 560px); }
.chart-table th, .chart-table td { padding: 5px var(--sp-3); border-bottom: 1px solid var(--line); text-align: right; }
.chart-table th:first-child, .chart-table td:first-child { text-align: left; }
.chart-table thead th { color: var(--ink-2); font-weight: 600; }
.chart-table tfoot td { font-weight: 700; border-bottom: 0; }
.table-scroll { overflow-x: auto; }

.chart-tip {
  position: fixed;
  z-index: 60;
  pointer-events: none;
  background: var(--navy-900);
  color: #fff;
  font-size: 12px;
  font-weight: 600;
  padding: 5px var(--sp-2);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  white-space: nowrap;
}
.chart-tip[hidden] { display: none; }

/* =========================================================
   5. Filter bar
   ========================================================= */
.filters {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--sp-3) var(--sp-4);
  margin: var(--sp-5) 0 var(--sp-4);
}
.filters .field { min-width: 180px; flex: 1 1 180px; }
.filters .field-actions { flex: 0 0 auto; }

/* =========================================================
   6. Form fields (shared by filter bar + add task modal)
   ========================================================= */
.field { display: flex; flex-direction: column; gap: var(--sp-1); }
.field label { font-weight: 600; font-size: 13px; color: var(--ink-2); }
.field input, .field select, .field textarea {
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  padding: var(--sp-2);
  background: #fff;
  width: 100%;
}
.field textarea { resize: vertical; min-height: 72px; }
.field [aria-invalid="true"] { border-color: var(--danger); background: var(--danger-bg); }
.field-error { color: var(--danger); font-size: 12px; min-height: 1em; }
.field-hint { color: var(--ink-3); font-size: 12px; font-weight: 400; }
.req { color: var(--danger); }

/* =========================================================
   7. Kanban board + columns
   ========================================================= */
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: var(--sp-4);
  align-items: start;
}
.column {
  background: var(--navy-50);
  border: 1px solid var(--line);
  border-top: 4px solid var(--seg-color);
  border-radius: var(--radius-sm);
  padding: var(--sp-3);
  min-height: 240px;
  transition: background-color .15s, border-color .15s;
}
.column.is-drop-target {
  background: var(--navy-100);
  border-color: var(--navy-700);
  border-style: dashed;
  border-top-style: solid;
}
.column-header {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: var(--sp-3);
}
.column-header h2 { font-family: var(--font-display); font-size: 16px; font-weight: 700; color: var(--navy-900); }
.count-badge { font-size: 13px; font-weight: 700; color: var(--ink-2); }
.card-list { display: flex; flex-direction: column; gap: var(--sp-2); min-height: 80px; }
.empty {
  color: var(--ink-3);
  text-align: center;
  padding: var(--sp-5) var(--sp-2);
  border: 1px dashed #c3ccd8;
  border-radius: var(--radius-sm);
  font-size: 13px;
}

@media (max-width: 1023px) {
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 767px) {
  .board { grid-template-columns: 1fr; }
  main, .app-header { padding-left: var(--sp-4); padding-right: var(--sp-4); }
  .progress-panel { padding: var(--sp-4); }
  .project-row { grid-template-columns: 1fr auto; gap: 6px var(--sp-3); }
  .project-row .bar { grid-column: 1 / -1; grid-row: 2; }
}

/* =========================================================
   8. Task cards
   ========================================================= */
.card {
  --prio-color: var(--p-medium);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: 3px solid var(--prio-color);
  border-radius: var(--radius-sm);
  padding: var(--sp-3);
  cursor: grab;
}
.card:hover { border-color: #b8c4d6; border-left-color: var(--prio-color); }
.card.dragging { opacity: .45; cursor: grabbing; }
.card.prio-critical { --prio-color: var(--p-critical); }
.card.prio-high     { --prio-color: var(--p-high); }
.card.prio-medium   { --prio-color: var(--p-medium); }
.card.prio-low      { --prio-color: var(--p-low); }

.card-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
}
.task-id { font-size: 12px; color: var(--ink-3); letter-spacing: .02em; }
.card-title { font-size: 14px; font-weight: 700; line-height: 1.35; margin: 6px 0 var(--sp-2); word-break: break-word; }
.card-meta { display: grid; gap: 2px; font-size: 12px; color: var(--ink-2); margin: 0; }
.card-meta div { display: flex; gap: 6px; }
.card-meta dt { color: var(--ink-3); min-width: 56px; }
.card-meta dd { margin: 0; }
.card-tags { display: flex; flex-wrap: wrap; gap: var(--sp-1); margin-top: var(--sp-2); }

.prio {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 12px;
  font-weight: 700;
  color: var(--prio-color);
}
.prio::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--prio-color); }
.card.prio-low .prio { color: var(--ink-3); }
.tag, .badge-overdue {
  display: inline-block;
  font-size: 11px;
  font-weight: 600;
  border-radius: 4px;
  padding: 1px 6px;
  line-height: 18px;
}
.tag { background: var(--navy-50); color: var(--navy-700); border: 1px solid var(--navy-100); }
.badge-overdue { background: var(--danger-bg); color: var(--danger); border: 1px solid #f3b4b4; }

.card-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-2);
  margin-top: var(--sp-3);
  padding-top: var(--sp-2);
  border-top: 1px solid #edf0f4;
}
.icon-btn {
  border: 1px solid transparent;
  background: transparent;
  border-radius: var(--radius-sm);
  width: 28px; height: 28px;
  font-size: 18px;
  line-height: 1;
  color: var(--ink-3);
}
.icon-btn:hover { background: var(--danger-bg); color: var(--danger); }
.move-btn {
  border: 1px solid var(--line);
  background: #fff;
  border-radius: var(--radius-sm);
  padding: 3px var(--sp-2);
  font-size: 12px;
  font-weight: 600;
  color: var(--navy-700);
}
.move-btn:hover { background: var(--navy-50); }
.move-menu { display: flex; flex-wrap: wrap; gap: var(--sp-1); width: 100%; }
.move-menu button {
  border: 1px solid var(--navy-700);
  background: var(--navy-50);
  color: var(--navy-900);
  border-radius: var(--radius-sm);
  padding: 3px var(--sp-2);
  font-size: 12px;
}
.move-menu button:hover { background: var(--navy-100); }
.confirm-row {
  display: flex;
  align-items: center;
  gap: var(--sp-1);
  font-size: 12px;
  font-weight: 600;
  color: var(--danger);
}
.confirm-row button {
  border-radius: var(--radius-sm);
  padding: 3px var(--sp-2);
  font-size: 12px;
  font-weight: 600;
  border: 1px solid var(--line);
  background: #fff;
}
.confirm-row .yes { background: var(--danger); border-color: var(--danger); color: #fff; }

/* =========================================================
   9. Add Task modal
   ========================================================= */
.modal-backdrop {
  position: fixed;
  inset: 0;
  background: rgba(13, 43, 94, .45);
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding: var(--sp-6) var(--sp-4);
  overflow-y: auto;
  z-index: 50;
}
.modal-backdrop[hidden] { display: none; }
.modal {
  background: var(--surface);
  border-radius: var(--radius);
  box-shadow: var(--shadow-lg);
  width: 100%;
  max-width: 620px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--sp-4) var(--sp-5);
  border-bottom: 1px solid var(--line);
}
.modal-header h2 { font-family: var(--font-display); font-size: 20px; font-weight: 700; color: var(--navy-900); }
.modal-header .icon-btn:hover { background: var(--navy-50); color: var(--navy-900); }
.modal-body {
  padding: var(--sp-4) var(--sp-5);
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--sp-2) var(--sp-4);
}
.modal-body .span-2 { grid-column: 1 / -1; }
.modal-footer {
  display: flex;
  justify-content: flex-end;
  gap: var(--sp-2);
  padding: var(--sp-3) var(--sp-5) var(--sp-4);
  border-top: 1px solid var(--line);
}
@media (max-width: 600px) {
  .modal-body { grid-template-columns: 1fr; }
}

/* =========================================================
   10. Toasts
   ========================================================= */
.toast-region {
  position: fixed;
  right: var(--sp-4);
  bottom: var(--sp-4);
  display: flex;
  flex-direction: column;
  gap: var(--sp-2);
  z-index: 100;
  max-width: min(360px, calc(100vw - 32px));
}
.toast {
  border-radius: var(--radius-sm);
  padding: var(--sp-3) var(--sp-4);
  box-shadow: var(--shadow-lg);
  font-weight: 600;
  border-left: 5px solid;
  background: #fff;
}
.toast-success { border-color: var(--success); color: var(--success); background: var(--success-bg); }
.toast-warning { border-color: var(--warning); color: var(--warning); background: var(--warning-bg); }
.toast-info    { border-color: var(--navy-700); color: var(--navy-900); background: var(--navy-50); }

@media (prefers-reduced-motion: reduce) {
  .bar, .seg, .column { transition: none; }
}
</style>
</head>
<body>

<!-- =========================================================
     Header: wordmark, demo note, add button
     ========================================================= -->
<header class="app-header">
  <div class="header-inner">
    <div class="wordmark">
      UOB IT PMO
      <span class="wordmark-sub">IT project board for internal demos and training</span>
    </div>
    <div class="header-side">
      <p class="demo-note">Demo mode: tasks live in memory only, so refreshing the page resets the board.</p>
      <button type="button" class="btn btn-light" id="open-add-btn" aria-haspopup="dialog">+ Add task</button>
    </div>
  </div>
</header>

<main>
  <!-- =========================================================
       Delivery progress: headline + stacked bar charts
       (counts ALL tasks; filled by renderSummary())
       ========================================================= -->
  <section class="progress-panel is-intro" id="progress-panel" aria-labelledby="progress-headline">
    <h1 class="progress-headline" id="progress-headline" aria-live="polite"></h1>
    <ul class="legend" id="legend" aria-label="Legend"></ul>
    <div class="bar" id="overall-bar" role="img"></div>

    <div class="by-project">
      <div class="by-project-head">
        <h3 id="by-project-title">By project</h3>
        <p>Select a project to filter the board. Select it again to clear.</p>
      </div>
      <ul class="project-rows" id="project-rows" aria-labelledby="by-project-title"></ul>
    </div>

    <details class="chart-table">
      <summary>Show as table</summary>
      <div class="table-scroll" id="chart-table"></div>
    </details>
  </section>
  <div class="chart-tip" id="chart-tip" hidden></div>

  <!-- =========================================================
       Filter bar (client-side only)
       ========================================================= -->
  <section aria-label="Filters">
    <form class="filters" id="filter-form" role="search">
      <div class="field">
        <label for="filter-project">Project / Workstream</label>
        <select id="filter-project"><option value="">All projects</option></select>
      </div>
      <div class="field">
        <label for="filter-assignee">Assignee contains</label>
        <input type="text" id="filter-assignee" placeholder="e.g. Tan" autocomplete="off" maxlength="60">
      </div>
      <div class="field">
        <label for="filter-priority">Priority</label>
        <select id="filter-priority"><option value="">All priorities</option></select>
      </div>
      <div class="field field-actions">
        <button type="button" class="btn btn-ghost" id="clear-filters">Clear filters</button>
      </div>
    </form>
  </section>

  <!-- =========================================================
       Kanban board (columns are filled by renderBoard())
       ========================================================= -->
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<!-- =========================================================
     Add Task modal
     ========================================================= -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" id="add-modal" role="dialog" aria-modal="true" aria-labelledby="add-modal-title">
    <form id="task-form" novalidate>
      <div class="modal-header">
        <h2 id="add-modal-title">Add task</h2>
        <button type="button" class="icon-btn" id="close-modal-btn" aria-label="Close add task dialog">×</button>
      </div>
      <div class="modal-body">
        <div class="field span-2">
          <label for="f-title">Task title <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="f-title" name="title" maxlength="80" required aria-describedby="err-title">
          <p class="field-error" id="err-title"></p>
        </div>
        <div class="field span-2">

    </form>
  </div>
</div>

<!-- Toast notifications (announced politely to screen readers) -->
<div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>

<!-- =========================================================
     FormSubmit configuration note
     FormSubmit (formsubmit.co) requires a ONE-TIME ACTIVATION:
     the first submission to a new address triggers a confirmation
     email to that address. Submissions are only delivered after
     the activation link in that email has been clicked.
     Change the address in FORMSUBMIT_ENDPOINT below (one place only).
     ========================================================= -->
<script>
"use strict";

/* =========================================================
   CONFIG: change the email address here (one place only)
   ========================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const NOTIFY_TIMEOUT_MS = 12000;

/* =========================================================
   Reference data
   ========================================================= */
const STATUSES = ["Backlog", "In Progress", "Blocked", "Done"];
const STATUS_HINTS = {
  "Backlog": "Logged, not yet scheduled",
  "In Progress": "Actively being worked",
  "Blocked": "Waiting on a dependency, vendor or approval",
  "Done": "Completed / closed",
};
// Chart stacking order (left to right) and the CSS class carrying each status colour.
const CHART_ORDER = ["Done", "In Progress", "Blocked", "Backlog"];
const STATUS_CLASS = { "Backlog": "st-backlog", "In Progress": "st-progress", "Blocked": "st-blocked", "Done": "st-done" };
const PROJECTS = [
  "Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift",
  "Data & Analytics", "Infrastructure & Cloud", "Vendor Management",
];
const CATEGORIES = [
  "Application Development", "Infrastructure", "Cybersecurity",
  "Data", "Compliance", "Vendor",
];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];
const PRIORITY_CLASS = { Critical: "critical", High: "high", Medium: "medium", Low: "low" };

/* =========================================================
   State: the single source of truth (memory only)
   ========================================================= */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
};
// Transient UI state (open move menu / pending delete confirmation).
const ui = { openMoveId: null, confirmDeleteId: null, focusKey: null };
let nextId = 1;
let inFlight = false;
let lastFocusBeforeModal = null;

/* =========================================================
   Utilities
   ========================================================= */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function toISODate(d) {
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${d.getFullYear()}-${m}-${day}`;
}

function todayISO() {
  return toISODate(new Date());
}

function addDays(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return toISODate(d);
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

function formatDate(iso) {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const [y, m, d] = iso.split("-");
  return `${Number(d)} ${months[Number(m) - 1]} ${y}`;
}

function formatId(n) {
  return `UOB-ITPM-${String(n).padStart(4, "0")}`;
}

function fillSelect(select, values) {
  values.forEach((v) => select.add(new Option(v, v)));
}

function countByStatus(tasks) {
  const counts = Object.fromEntries(STATUSES.map((s) => [s, 0]));
  tasks.forEach((t) => { counts[t.status] += 1; });
  return counts;
}

function plural(n, word) {
  return `${n} ${word}${n === 1 ? "" : "s"}`;
}

/* =========================================================
   Seed data: 8 demo tasks (due dates relative to today)
   ========================================================= */
function seedTasks() {
  const seed = [
    { title: "Migrate FX pricing service to AWS", description: "Lift-and-shift of FX pricing microservice to the AWS landing zone with blue/green cutover.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Tan Wei Ming", priority: "High", dueDate: addDays(14), status: "In Progress" },
    { title: "Patch CVE-2025-XXXX on branch teller VDI", description: "Apply vendor hotfix to all branch teller VDI golden images and redeploy.", project: "Cybersecurity Uplift", category: "Cybersecurity", assignee: "Priya Nair", priority: "Critical", dueDate: addDays(-2), status: "In Progress" },
    { title: "UAT sign-off for mobile onboarding release 4.2", description: "Obtain business UAT sign-off; awaiting fix for eKYC edge case.", project: "Digital Channels", category: "Application Development", assignee: "Lim Jia Hui", priority: "High", dueDate: addDays(-1), status: "Blocked" },
    { title: "Firewall rule review for SWIFT gateway", description: "Quarterly rule recertification for the SWIFT gateway segment.", project: "Cybersecurity Uplift", category: "Compliance", assignee: "Ahmad Faizal", priority: "Medium", dueDate: addDays(21), status: "Backlog" },
    { title: "Renew Oracle DB support contract", description: "Negotiate renewal terms; pending procurement approval.", project: "Vendor Management", category: "Vendor", assignee: "Grace Wong", priority: "Medium", dueDate: addDays(9), status: "Blocked" },
    { title: "Build MAS TRM compliance dashboard", description: "Dashboard tracking TRM control status across application portfolio.", project: "Data & Analytics", category: "Data", assignee: "Rajesh Kumar", priority: "Low", dueDate: addDays(35), status: "Backlog" },
    { title: "Core banking batch job performance tuning", description: "Reduce end-of-day batch window by 20% ahead of upgrade cutover.", project: "Core Banking Upgrade", category: "Application Development", assignee: "Tan Wei Ming", priority: "Medium", dueDate: addDays(5), status: "In Progress" },
    { title: "Decommission legacy ATM switch", description: "Final traffic migrated; hardware returned to vendor.", project: "Infrastructure & Cloud", category: "Infrastructure", assignee: "Chen Li Ting", priority: "Low", dueDate: addDays(-6), status: "Done" },
  ];
  state.tasks = seed.map((t) => ({ id: formatId(nextId++), ...t }));
}

/* =========================================================
   Filtering (pure, over the in-memory array)
   ========================================================= */
function applyFilters() {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return state.tasks.filter((t) =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

/* =========================================================
   Progress chart
   The chart's DOM is built once (buildChart) so segment widths
   can animate; renderSummary() only updates counts and widths.
   It counts ALL tasks, like the old header summary did.
   ========================================================= */
function segmentsHtml() {
  return CHART_ORDER.map((s) =>
    `<span class="seg ${STATUS_CLASS[s]}" data-status="${escapeHtml(s)}" hidden></span>`
  ).join("");
}

function buildChart() {
  document.getElementById("legend").innerHTML = CHART_ORDER.map((s) =>
    `<li class="${STATUS_CLASS[s]}"><span class="swatch" aria-hidden="true"></span>${escapeHtml(s)} <strong data-legend="${escapeHtml(s)}">0</strong></li>`
  ).join("");
  document.getElementById("overall-bar").innerHTML = segmentsHtml();
  document.getElementById("project-rows").innerHTML = PROJECTS.map((p) => `
    <li>
      <button type="button" class="project-row" data-project="${escapeHtml(p)}" aria-pressed="false">
        <span class="project-name">${escapeHtml(p)}</span>
        <span class="bar bar-sm" aria-hidden="true">${segmentsHtml()}</span>
        <span class="project-count"></span>
      </button>
    </li>`).join("");
}

// Pick the longest direct label that fits the segment's final width
// (estimated, because the width may still be animating).
function segmentLabel(status, n, segWidth) {
  const fits = (text) => text.length * 8 + 16 <= segWidth;
  if (fits(`${status} ${n}`)) return `${status} ${n}`;
  return fits(String(n)) ? String(n) : "";
}

// Size and label one bar's segments. Direct labels only on the big bar.
function paintBar(bar, counts, total, withLabels) {
  const shown = CHART_ORDER.filter((s) => counts[s] > 0).length;
  const usable = bar.clientWidth - 2 * Math.max(0, shown - 1);
  bar.querySelectorAll(".seg").forEach((seg) => {
    const status = seg.dataset.status;
    const n = counts[status];
    const share = total ? n / total : 0;
    seg.hidden = n === 0;
    seg.style.flexGrow = String(n);
    seg.dataset.tip = `${status}: ${n} of ${plural(total, "task")} (${Math.round(share * 100)}%)`;
    if (withLabels) seg.textContent = n ? segmentLabel(status, n, usable * share) : "";
  });
}

function describeCounts(counts) {
  return CHART_ORDER.map((s) => `${counts[s]} ${s.toLowerCase()}`).join(", ");
}

function renderSummary() {
  const total = state.tasks.length;
  const counts = countByStatus(state.tasks);
  const overdue = state.tasks.filter(isOverdue).length;

  // Headline sentence
  let headline;
  if (!total) {
    headline = "No tasks on the board yet. Add one to start tracking delivery.";
  } else {
    const issues = [];
    if (counts.Blocked) issues.push(`${counts.Blocked} blocked`);
    if (overdue) issues.push(`${overdue} overdue`);
    headline = `${counts.Done} of ${plural(total, "task")} done. ` +
      (issues.length ? `${issues.join(", ")}.` : "Nothing blocked or overdue.");
  }
  document.getElementById("progress-headline").textContent = headline;

  // Legend counts + overall bar
  document.querySelectorAll("[data-legend]").forEach((el) => { el.textContent = counts[el.dataset.legend]; });
  const overall = document.getElementById("overall-bar");
  paintBar(overall, counts, total, true);
  overall.setAttribute("aria-label", total ? `All projects: ${describeCounts(counts)}.` : "No tasks yet.");

  // One row per project
  document.querySelectorAll(".project-row").forEach((row) => {
    const project = row.dataset.project;
    const tasks = state.tasks.filter((t) => t.project === project);
    const pc = countByStatus(tasks);
    const selected = state.filters.project === project;
    paintBar(row.querySelector(".bar"), pc, tasks.length, false);
    row.querySelector(".project-count").textContent = tasks.length ? `${pc.Done} of ${tasks.length} done` : "No tasks";
    row.setAttribute("aria-pressed", String(selected));
    row.setAttribute("aria-label",
      `${project}: ${tasks.length ? describeCounts(pc) : "no tasks"}. ` +
      (selected ? "Showing only this project. Select to show all projects." : "Select to show only this project."));
  });

  // Table view (same numbers, for screen readers and exact values)
  const rows = PROJECTS.map((p) => {
    const pc = countByStatus(state.tasks.filter((t) => t.project === p));
    const sum = STATUSES.reduce((a, s) => a + pc[s], 0);
    return `<tr><td>${escapeHtml(p)}</td>${CHART_ORDER.map((s) => `<td>${pc[s]}</td>`).join("")}<td>${sum}</td></tr>`;
  }).join("");
  document.getElementById("chart-table").innerHTML = `
    <table>
      <thead><tr><th scope="col">Project</th>${CHART_ORDER.map((s) => `<th scope="col">${escapeHtml(s)}</th>`).join("")}<th scope="col">Total</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td>All projects</td>${CHART_ORDER.map((s) => `<td>${counts[s]}</td>`).join("")}<td>${total}</td></tr></tfoot>
    </table>`;
}

function wireChart() {
  const tip = document.getElementById("chart-tip");
  const panel = document.getElementById("progress-panel");

  // Hover tooltip for any segment (text only, never HTML).
  panel.addEventListener("pointermove", (e) => {
    const seg = e.target.closest(".seg");
    if (!seg || seg.hidden) { tip.hidden = true; return; }
    const row = seg.closest(".project-row");
    tip.textContent = (row ? `${row.dataset.project}. ` : "") + seg.dataset.tip;
    tip.hidden = false;
    const x = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8);
    tip.style.left = `${Math.max(8, x)}px`;
    tip.style.top = `${e.clientY + 16}px`;
  });
  panel.addEventListener("pointerleave", () => { tip.hidden = true; });

  // Selecting a project row toggles the project filter.
  document.getElementById("project-rows").addEventListener("click", (e) => {
    const row = e.target.closest(".project-row");
    if (!row) return;
    const select = document.getElementById("filter-project");
    select.value = state.filters.project === row.dataset.project ? "" : row.dataset.project;
    select.dispatchEvent(new Event("change"));
  });

  // Direct labels depend on bar width, so refit them after a resize.
  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderSummary, 150);
  });

  // One orchestrated moment: the bars grow in on first load.
  requestAnimationFrame(() => requestAnimationFrame(() => panel.classList.remove("is-intro")));
}

/* =========================================================
   Board rendering
   ========================================================= */
function renderCard(task) {
  const id = escapeHtml(task.id);
  const prio = PRIORITY_CLASS[task.priority] || "medium";
  const overdue = isOverdue(task);

  let actions;
  if (ui.confirmDeleteId === task.id) {
    actions = `
      <div class="confirm-row" role="group" aria-label="Confirm delete ${id}">
        <span>Delete?</span>
        <button type="button" class="yes" data-action="delete-yes" data-id="${id}" data-focus-key="yes:${id}">Yes</button>
        <button type="button" data-action="delete-no" data-id="${id}" data-focus-key="no:${id}">No</button>
      </div>`;
  } else {
    const moveOpen = ui.openMoveId === task.id;
    const menu = moveOpen
      ? `<div class="move-menu" role="group" aria-label="Move ${id} to column">
          ${STATUSES.filter((s) => s !== task.status).map((s, i) =>
            `<button type="button" data-action="move-to" data-id="${id}" data-status="${escapeHtml(s)}"${i === 0 ? ` data-focus-key="menu:${id}"` : ""}>${escapeHtml(s)}</button>`
          ).join("")}
        </div>`
      : "";
    actions = `
      <button type="button" class="move-btn" data-action="move-toggle" data-id="${id}" data-focus-key="move:${id}"
        aria-expanded="${moveOpen}" aria-label="Move task ${id} to another column">Move ▸</button>
      <button type="button" class="icon-btn" data-action="delete" data-id="${id}" data-focus-key="del:${id}"
        aria-label="Delete task ${id}">×</button>
      ${menu}`;
  }

  return `
    <article class="card prio-${prio}" draggable="true" data-id="${id}" aria-label="${id}: ${escapeHtml(task.title)}">
      <div class="card-top">
        <span class="task-id">${id}</span>
        <span class="prio">${escapeHtml(task.priority)}</span>
      </div>
      <h3 class="card-title">${escapeHtml(task.title)}</h3>
      <dl class="card-meta">
        <div><dt>Project</dt> <dd>${escapeHtml(task.project)}</dd></div>
        <div><dt>Assignee</dt> <dd>${escapeHtml(task.assignee)}</dd></div>
        <div><dt>Due</dt> <dd><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></dd></div>
      </dl>
      <div class="card-tags">
        <span class="tag">${escapeHtml(task.category)}</span>
        ${overdue ? `<span class="badge-overdue">Overdue</span>` : ""}
      </div>
      <div class="card-actions">${actions}</div>
    </article>`;
}

function renderBoard() {
  const visible = applyFilters();
  const board = document.getElementById("board");

  board.innerHTML = STATUSES.map((status) => {
    const tasks = visible.filter((t) => t.status === status);
    const slug = status.toLowerCase().replace(/\s+/g, "-");
    const noun = tasks.length === 1 ? "task" : "tasks";
    return `
      <section class="column ${STATUS_CLASS[status]}" data-status="${escapeHtml(status)}" aria-labelledby="col-${slug}">
        <div class="column-header">
          <h2 id="col-${slug}" title="${escapeHtml(STATUS_HINTS[status])}">${escapeHtml(status)}</h2>
          <span class="count-badge" aria-label="${tasks.length} ${noun}">${tasks.length}</span>
        </div>
        <div class="card-list">
          ${tasks.length ? tasks.map(renderCard).join("") : `<p class="empty">No tasks here. Drag a card in or use Move.</p>`}
        </div>
      </section>`;
  }).join("");

  renderSummary();

  // Restore keyboard focus to the relevant control after a re-render.
  if (ui.focusKey) {
    const el = board.querySelector(`[data-focus-key="${CSS.escape(ui.focusKey)}"]`);
    if (el) el.focus();
    ui.focusKey = null;
  }
}

/* =========================================================
   Actions (mutate state, then re-render)
   ========================================================= */
function addTask(data) {
  const task = { id: formatId(nextId++), ...data };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, status) {
  const task = state.tasks.find((t) => t.id === id);
  if (!task || !STATUSES.includes(status) || task.status === status) return false;
  task.status = status;
  ui.openMoveId = null;
  renderBoard();
  return true;
}

function deleteTask(id) {
  state.tasks = state.tasks.filter((t) => t.id !== id);
  ui.confirmDeleteId = null;
  renderBoard();
}

/* =========================================================
   Toasts
   ========================================================= */
function showToast(message, type = "success", duration = 4500) {
  const region = document.getElementById("toast-region");
  const toast = document.createElement("div");
  toast.className = `toast toast-${type}`;
  toast.textContent = message;
  region.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

/* =========================================================
   FormSubmit notification (AJAX JSON endpoint)
   ========================================================= */
async function notifyNewTask(task) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), NOTIFY_TIMEOUT_MS);
  try {
    const res = await fetch(FORMSUBMIT_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", Accept: "application/json" },
      signal: controller.signal,
      referrerPolicy: "no-referrer",
      body: JSON.stringify({
        _subject: `[UOB IT PMO] New task ${task.id}: ${task.title}`,
        _template: "table",
        _captcha: "false",
        "Task ID": task.id,
        Title: task.title,
        Description: task.description,
        Project: task.project,
        Category: task.category,
        Assignee: task.assignee,
        Priority: task.priority,
        "Due Date": task.dueDate,
        Status: task.status,
        "Submitted At": new Date().toISOString(),
      }),
    });
    if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
    const json = await res.json();
    // FormSubmit can answer 200 with { success: "false" } (e.g. not yet activated).
    if (json && String(json.success) === "false") {
      throw new Error(`FormSubmit rejected: ${json.message || "unknown"}`);
    }
    return json;
  } finally {
    clearTimeout(timer);
  }
}

/* =========================================================
   Add Task form: read, validate, submit
   ========================================================= */
const FORM_FIELDS = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

function readForm() {
  const form = document.getElementById("task-form");
  const data = {};
  FORM_FIELDS.forEach((name) => { data[name] = form.elements[name].value.trim(); });
  return data;
}

function validateForm(data) {
  const errors = {};
  if (!data.title) errors.title = "Task title is required.";
  else if (data.title.length > 80) errors.title = "Title must be 80 characters or fewer.";
  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(data.project)) errors.project = "Choose a project / workstream.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";
  if (!data.assignee) errors.assignee = "Assignee is required.";
  else if (data.assignee.length > 60) errors.assignee = "Assignee must be 60 characters or fewer.";
  if (!PRIORITIES.includes(data.priority)) errors.priority = "Choose a priority.";
  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";
  if (!STATUSES.includes(data.status)) errors.status = "Choose a status.";
  return errors;
}

function showFormErrors(errors) {
  const form = document.getElementById("task-form");
  let firstInvalid = null;
  FORM_FIELDS.forEach((name) => {
    const input = form.elements[name];
    const msg = errors[name] || "";
    document.getElementById(`err-${name}`).textContent = msg;
    if (msg) {
      input.setAttribute("aria-invalid", "true");
      if (!firstInvalid) firstInvalid = input;
    } else {
      input.removeAttribute("aria-invalid");
    }
  });
  if (firstInvalid) firstInvalid.focus();
}

function resetForm() {
  const form = document.getElementById("task-form");
  form.reset();
  form.elements.priority.value = "Medium";
  form.elements.status.value = "Backlog";
  form.elements.dueDate.min = todayISO();
  showFormErrors({});
}

function setSending(sending) {
  inFlight = sending;
  const btn = document.getElementById("submit-btn");
  btn.disabled = sending;
  btn.textContent = sending ? "Sending…" : "Add task";
  btn.setAttribute("aria-busy", String(sending));
}

async function handleSubmit(event) {
  event.preventDefault();
  if (inFlight) return;

  const data = readForm();
  const errors = validateForm(data);
  showFormErrors(errors);
  if (Object.keys(errors).length) return;

  // Optimistic UI: the card appears immediately.
  const task = addTask(data);
  resetForm();
  showToast(`Task ${task.id} added to ${task.status}.`, "success");

  // Email notification runs in parallel; failure never breaks the board.
  setSending(true);
  try {
    await notifyNewTask(task);
    showToast(`Email notification sent for ${task.id}.`, "info");
  } catch (err) {
    console.warn(err);
    showToast("Card added locally — email notification failed", "warning", 6000);
  } finally {
    setSending(false);
    closeModal();
  }
}

/* =========================================================
   Modal open / close / focus trap
   ========================================================= */
function openModal() {
  lastFocusBeforeModal = document.activeElement;
  document.getElementById("task-form").elements.dueDate.min = todayISO();
  document.getElementById("modal-backdrop").hidden = false;
  document.getElementById("f-title").focus();
}

function closeModal() {
  const backdrop = document.getElementById("modal-backdrop");
  if (backdrop.hidden) return;
  backdrop.hidden = true;
  if (lastFocusBeforeModal && document.contains(lastFocusBeforeModal)) lastFocusBeforeModal.focus();
}

function trapFocus(event) {
  if (event.key !== "Tab") return;
  const focusables = [...document.getElementById("add-modal")
    .querySelectorAll("button, input, select, textarea")].filter((el) => !el.disabled);
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault(); last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault(); first.focus();
  }
}

/* =========================================================
   Board interactions: card buttons (click delegation)
   ========================================================= */
function handleBoardClick(event) {
  const btn = event.target.closest("button[data-action]");
  if (!btn) return;
  const id = btn.dataset.id;

  switch (btn.dataset.action) {
    case "move-toggle":
      ui.openMoveId = ui.openMoveId === id ? null : id;
      ui.confirmDeleteId = null;
      ui.focusKey = ui.openMoveId ? `menu:${id}` : `move:${id}`;
      renderBoard();
      break;
    case "move-to":
      ui.focusKey = `move:${id}`;
      if (moveTask(id, btn.dataset.status)) showToast(`${id} moved to ${btn.dataset.status}.`, "info", 2500);
      break;
    case "delete":
      ui.confirmDeleteId = id;
      ui.openMoveId = null;
      ui.focusKey = `no:${id}`;
      renderBoard();
      break;
    case "delete-no":
      ui.confirmDeleteId = null;
      ui.focusKey = `del:${id}`;
      renderBoard();
      break;
    case "delete-yes":
      deleteTask(id);
      showToast(`${id} deleted.`, "info", 2500);
      break;
  }
}

/* =========================================================
   Board interactions: native HTML5 drag and drop
   ========================================================= */
function clearDropTargets() {
  document.querySelectorAll(".column.is-drop-target").forEach((c) => c.classList.remove("is-drop-target"));
}

function wireDragAndDrop(board) {
  board.addEventListener("dragstart", (e) => {
    const card = e.target.closest(".card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });

  board.addEventListener("dragend", (e) => {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("dragging");
    clearDropTargets();
  });

  board.addEventListener("dragover", (e) => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (!column.classList.contains("is-drop-target")) {
      clearDropTargets();
      column.classList.add("is-drop-target");
    }
  });

  board.addEventListener("dragleave", (e) => {
    const column = e.target.closest(".column");
    if (column && !column.contains(e.relatedTarget)) column.classList.remove("is-drop-target");
  });

  board.addEventListener("drop", (e) => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    clearDropTargets();
    const id = e.dataTransfer.getData("text/plain");
    if (moveTask(id, column.dataset.status)) showToast(`${id} moved to ${column.dataset.status}.`, "info", 2500);
  });
}

/* =========================================================
   Filter bar wiring
   ========================================================= */
function wireFilters() {
  const project = document.getElementById("filter-project");
  const assignee = document.getElementById("filter-assignee");
  const priority = document.getElementById("filter-priority");

  const update = () => {
    state.filters = { project: project.value, assignee: assignee.value, priority: priority.value };
    renderBoard();
  };
  project.addEventListener("change", update);
  priority.addEventListener("change", update);
  assignee.addEventListener("input", update);
  document.getElementById("filter-form").addEventListener("submit", (e) => e.preventDefault());
  document.getElementById("clear-filters").addEventListener("click", () => {
    project.value = ""; assignee.value = ""; priority.value = "";
    update();
  });
}

/* =========================================================
   Init
   ========================================================= */
function init() {
  seedTasks();

  fillSelect(document.getElementById("filter-project"), PROJECTS);
  fillSelect(document.getElementById("filter-priority"), PRIORITIES);
  fillSelect(document.getElementById("f-project"), PROJECTS);
  fillSelect(document.getElementById("f-category"), CATEGORIES);
  fillSelect(document.getElementById("f-priority"), PRIORITIES);
  fillSelect(document.getElementById("f-status"), STATUSES);
  resetForm();

  buildChart();
  wireChart();

  const board = document.getElementById("board");
  board.addEventListener("click", handleBoardClick);
  wireDragAndDrop(board);
  wireFilters();

  document.getElementById("task-form").addEventListener("submit", handleSubmit);
  document.getElementById("open-add-btn").addEventListener("click", openModal);
  document.getElementById("close-modal-btn").addEventListener("click", closeModal);
  document.getElementById("cancel-modal-btn").addEventListener("click", closeModal);
  document.getElementById("modal-backdrop").addEventListener("click", (e) => {
    if (e.target.id === "modal-backdrop") closeModal();
  });
  document.getElementById("add-modal").addEventListener("keydown", trapFocus);

  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    if (!document.getElementById("modal-backdrop").hidden) { closeModal(); return; }
    if (ui.openMoveId) {
      ui.focusKey = `move:${ui.openMoveId}`;
      ui.openMoveId = null;
      renderBoard();
    }
  });

  renderBoard();
}

init();
</script>
